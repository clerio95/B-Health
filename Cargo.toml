[package]
name = "b-health"
version = "0.1.0"
edition = "2024"
description = "Terminal blood-test tracker for Brazilian lab reports"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4"
directories = "6.0.0"
pdf-extract = "0.12.1"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
